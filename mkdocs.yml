site_name: APAS Documentation
site_url: https://pavelrakcheev.github.io/APAS-Telegram-Bot/
repo_url: https://github.com/pavelrakcheev/APAS-Telegram-Bot
repo_name: APAS-Telegram-Bot
edit_uri: edit/main/docs/

site_author: Pavel Rakcheev
site_description: >
  Adaptive Analytic Predictive System — experimental ecosystem
  around a Telegram bot with multi-model AI.

copyright: '&copy; 2025 Pavel Rakcheev. MIT License.'

theme:
  name: material
  language: ru
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/robot
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - announce.dismiss

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pavelrakcheev
    - icon: fontawesome/brands/telegram
      link: https://t.me/Intelligence_playground_bot
  status:
    canary: experimental

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - css/custom.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: SETUP.md
    - Development: DEVELOPMENT.md
  - Deep Dive:
    - Architecture: ARCHITECTURE.md
    - Gallery: gallery.md
  - Quality:
    - Known Issues: KNOWN-ISSUES.md
    - Audit DeepSeek: AUDIT-01-deepseek.md
    - Audit Codex Security: AUDIT-02-codex.md
