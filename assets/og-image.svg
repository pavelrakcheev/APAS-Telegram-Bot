<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Glow effect -->
  <circle cx="600" cy="315" r="200" fill="url(#accent)" opacity="0.05"/>
  <circle cx="600" cy="315" r="300" fill="url(#accent)" opacity="0.03"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="white">APAS</text>

  <!-- Subtitle -->
  <text x="600" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Адаптивная Аналитическая Предиктивная Система</text>

  <!-- Divider -->
  <line x1="400" y1="260" x2="800" y2="260" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

  <!-- Stats -->
  <text x="200" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#green)">18+</text>
  <text x="200" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">ИИ-моделей</text>

  <text x="400" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#green)">22</text>
  <text x="400" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Команды</text>

  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#green)">11</text>
  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Подсистем</text>

  <text x="800" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#green)">4</text>
  <text x="800" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Провайдера</text>

  <text x="1000" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#green)">9K</text>
  <text x="1000" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Строк кода</text>

  <!-- Tags -->
  <rect x="280" y="410" width="80" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="320" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Python</text>

  <rect x="380" y="410" width="60" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="410" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Groq</text>

  <rect x="460" y="410" width="70" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="495" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Gemini</text>

  <rect x="550" y="410" width="80" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="590" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">YandexGPT</text>

  <rect x="650" y="410" width="60" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="680" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Flask</text>

  <rect x="730" y="410" width="50" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="755" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Qt</text>

  <rect x="800" y="410" width="90" height="28" rx="14" fill="#1f6feb" opacity="0.2"/>
  <text x="845" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#58a6ff">Telegram</text>

  <!-- Version badge -->
  <rect x="480" y="480" width="240" height="40" rx="20" fill="url(#accent)" opacity="0.15"/>
  <text x="600" y="505" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">v0.1.0-canary</text>

  <!-- Subsystems -->
  <text x="600" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#484f58">ISS · ISS Play · ISS Points · ISS.ME · Blum · Alice AI Mode · One Core API</text>

  <!-- Footer -->
  <text x="600" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#484f58">github.com/pavelrakcheev/APAS-Telegram-Bot</text>
</svg>
