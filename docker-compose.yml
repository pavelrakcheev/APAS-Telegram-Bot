services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./Chats:/app/Chats
    restart: unless-stopped

  mini-app:
    build:
      context: ./Mini App
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    volumes:
      - ./data:/data
    restart: unless-stopped
