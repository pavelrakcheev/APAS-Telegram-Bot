services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    volumes:
      - bot-data:/app/data
      - bot-chats:/app/Chats
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    networks:
      - apas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mini-app:
    build:
      context: ./Mini App
      dockerfile: Dockerfile
    ports:
      - "${MINI_APP_PORT:-5000}:5000"
    environment:
      PORT: "5000"
    volumes:
      - mini-app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - apas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    driver: local
  bot-chats:
    driver: local
  mini-app-data:
    driver: local

networks:
  apas-network:
    driver: bridge
